<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">AI draft CD-0131 length comparison; owner wording approved, image review pending</title><desc id="desc">A long strip is exactly twice a short strip. Two copies of the short strip placed end to end match the long strip.</desc><rect width="640" height="360" fill="#faf8ef"/><g stroke="#293c45" stroke-width="2"><rect id="this-long-strip" x="100" y="65" width="400" height="32" fill="#dd6660"/><rect id="that-short-strip" x="100" y="140" width="200" height="32" fill="#619dc1"/><rect id="copy-one" x="100" y="245" width="200" height="32" fill="#619dc1"/><rect id="copy-two" x="300" y="245" width="200" height="32" fill="#619dc1"/></g></svg>
