<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CD-0151 equal length draft</title><desc id="desc">Two straight ropes have exactly aligned left and right endpoints and equal length on the same flat plane.</desc><rect width="640" height="360" fill="#faf8ef"/><line id="this-rope" x1="100" y1="125" x2="500" y2="125" stroke="#c9655e" stroke-width="16"/><line id="that-rope" x1="100" y1="230" x2="500" y2="230" stroke="#548eaf" stroke-width="16"/></svg>
